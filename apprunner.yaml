version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install --no-cache-dir -r requirements.txt
run:
  runtime-version: 3.11
  command: python -m src.beer_clanker_bot.api
  network:
    port: 8000
  env:
    - name: AWS_REGION
      value: us-east-1
    - name: CLANKER_HOST
      value: 0.0.0.0
    - name: CLANKER_PORT
      value: 8000
    - name: CLANKER_LOG_LEVEL
      value: INFO
